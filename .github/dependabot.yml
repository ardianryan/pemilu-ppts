version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "cron"
      cron: "0 7 28 * *"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "php"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cron: "0 7 28 * *"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 10
